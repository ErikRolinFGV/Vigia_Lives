# nginx na frente da API do Vigia. Copie para /etc/nginx/sites-available/,
# troque vigia.exemplo.br pelo endereco do servidor e ative.
#
# Senha na porta: o login da interface ainda e de demonstracao (aceita
# qualquer e-mail), entao quem protege os dados e o nginx. Crie a senha com
#   sudo htpasswd -c /etc/nginx/vigia.htpasswd erik
# (pacote apache2-utils). HTTPS: sudo certbot --nginx -d vigia.exemplo.br

server {
    listen 80;
    server_name vigia.exemplo.br;

    auth_basic "Vigia";
    auth_basic_user_file /etc/nginx/vigia.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ligar o vigia pela interface espera o primeiro batimento
        proxy_read_timeout 60s;
    }

    # O link publico de um relatorio abre sem senha: e feito para ser
    # compartilhado e so mostra numeros agregados. Precisa da pagina (/r/),
    # do dado (/api/r/) e dos arquivos da interface.
    location ^~ /r/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location ^~ /api/r/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location ^~ /assets/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /favicon.svg {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000;
    }
}
