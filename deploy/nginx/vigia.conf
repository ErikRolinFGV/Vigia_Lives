# nginx na frente da API do Vigia. Copie para /etc/nginx/sites-available/,
# troque vigia.exemplo.br pelo endereco do servidor e ative.
#
# Quem pede senha e a propria interface (api/acessos.py, contas criadas com
# python -m api.acessos). O nginx so recebe o acesso de fora e cuida do
# HTTPS: sudo certbot --nginx -d vigia.exemplo.br
# O link publico de relatorio (/r/ e /api/r/) abre sem login, de proposito.

server {
    listen 80;
    server_name vigia.exemplo.br;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # a API usa o IP de verdade para travar tentativas de senha erradas,
        # e o https para marcar o cookie da sessao como seguro
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ligar o vigia pela interface espera o primeiro batimento
        proxy_read_timeout 60s;
    }
}
